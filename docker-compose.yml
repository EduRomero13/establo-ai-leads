services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          S=$$(ls /opt/mssql-tools*/bin/sqlcmd 2>/dev/null | tail -1);
          [ -n "$$S" ] && $$S -C -b -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [establo-network]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    restart: unless-stopped
    expose: ["3000"]
    environment:
      NODE_ENV: production
      DB_SERVER: database
      DB_PORT: "1433"
      DB_NAME: buyer
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      WHAPI_TOKEN: ${WHAPI_TOKEN:?Define WHAPI_TOKEN}
      WHAPI_API_URL: https://gate.whapi.cloud
      WHAPI_WEBHOOK_TOKEN: ${WHAPI_WEBHOOK_TOKEN:?Define WHAPI_WEBHOOK_TOKEN}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      TZ: America/Lima
    depends_on:
      database:
        condition: service_healthy
    networks: [establo-network, dokploy-network]

networks:
  establo-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mssql-data:
