services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - establo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DB_SERVER: database
      DB_PORT: "1433"
      DB_NAME: buyer
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      WHAPI_TOKEN: ${WHAPI_TOKEN:?Define WHAPI_TOKEN}
      WHAPI_API_URL: https://gate.whapi.cloud
      WHAPI_WEBHOOK_SECRET: ${WHAPI_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      TZ: America/Lima
    depends_on:
      - database
    networks:
      - establo-network

networks:
  establo-network:
    driver: bridge

volumes:
  mssql-data:
